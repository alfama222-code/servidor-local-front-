paths:
  /proposta:
    get:
      tags:
        - proposta
      summary: listar todas as propostas
      description: retorna ums lista de todas as propostas disponiveis
      responses:
        "200":
          descriptions: lista de propostas
          content:
            application/json:
              schema:
                type: array
                $ref: "#/components/schemas/ResponseSucess"
        "404":
          descripitions: nenhuma proposta encontrada
          content:
            aplication/json:
              schema:
                type: object
                $ref: "#/components/schemas/ReferencesError"
        "400":
          description: dados invalidos
          content:
            aplication/json:
              schema:
                type: object
                $ref: "#/components/schemas/ReferencesError"


