components:
  schemas:
    proposta:
      type: object
      properties:
        id:
          type: intenger
          example: 1
        id_prestacao:
          type: number
          example: 1
        precoHora:
          type: number
          example: 1000
        horaEstimadas:
          type: number
          example: 10
        estado:
          type: string
          example: "aceita"
        enabled:
          type: boolean
          example: true
